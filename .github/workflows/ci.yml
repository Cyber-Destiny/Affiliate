name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app (test APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APKs
        env:
          # Add these under Settings → Secrets and variables → Actions.
          # Without them the APK still builds but shows "not connected".
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: ./gradlew assembleDebug assembleRelease
      - name: Rename APKs
        run: |
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk ../apk/naija-sound-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/naija-sound-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: naija-sound-apk
          path: apk/*.apk
          if-no-files-found: error

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    name: Database schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/test/package-lock.json
      - run: npm ci
      - run: npm test
